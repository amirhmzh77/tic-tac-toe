<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3efe4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tic Tac Toe">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Pencil Tic Tac Toe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: one centered notebook page, board dominant, controls as pencil-written chips below */
  --paper: #f3efe4;
  --grid: #d9d2bf;
  --ink: #22303c;
  --x: #c2410c;
  --o: #17708c;
  --win: #b45309;
  --display: "Caveat Brush", "Comic Sans MS", cursive;
  --body: "Kalam", "Segoe Print", "Comic Sans MS", cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1c2329; --grid: #2f3a42; --ink: #ebe6d8; --x: #ff9d66; --o: #6cc6e0; --win: #ffc861;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1c2329; --grid: #2f3a42; --ink: #ebe6d8; --x: #ff9d66; --o: #6cc6e0; --win: #ffc861;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; margin: 0; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: var(--body);
  display: flex; justify-content: center; align-items: flex-start;
  padding: calc(20px + env(safe-area-inset-top)) 16px calc(32px + env(safe-area-inset-bottom));
  overflow-y: auto;
}
main { width: 100%; max-width: 420px; display: flex; flex-direction: column; gap: 18px; }
h1 { font-family: var(--display); font-weight: 400; font-size: 2.4rem; margin: 0; line-height: 1; text-wrap: balance; letter-spacing: .5px; }
h1 span.x { color: var(--x); } h1 span.o { color: var(--o); }

.scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.score { background: var(--paper); border: 2px solid var(--ink); border-radius: 12px 4px 14px 5px; padding: 8px 6px; text-align: center; transition: transform .15s; }
.score.active { transform: translateY(-3px) rotate(-1deg); box-shadow: 3px 3px 0 var(--ink); }
.score b { display: block; font-family: var(--display); font-weight: 400; font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: .85rem; }
.score.sx b { color: var(--x); } .score.so b { color: var(--o); }

#status { font-family: var(--display); font-size: 1.7rem; min-height: 2.2rem; margin: 0; text-wrap: balance; }

.boardwrap { position: relative; width: 100%; aspect-ratio: 1; background: var(--paper); border-radius: 6px; padding: 10px; box-shadow: 0 0 0 2px var(--grid); }
.board { position: relative; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 100%; height: 100%; }
.cell { appearance: none; background: transparent; border: 0; padding: 10px; cursor: pointer; position: relative; color: inherit; border-radius: 10px; }
.cell:nth-child(3n+1), .cell:nth-child(3n+2) { border-right: 5px solid var(--ink); border-radius: 0; }
.cell:nth-child(-n+6) { border-bottom: 5px solid var(--ink); border-radius: 0; }
.cell:focus-visible { outline: 3px dashed var(--win); outline-offset: -6px; }
.cell:not(:disabled):hover { background: color-mix(in srgb, var(--grid) 55%, transparent); }
.cell:disabled { cursor: default; }
.cell svg { width: 100%; height: 100%; display: block; overflow: visible; }
.mark { fill: none; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 0; }
.mark.x { stroke: var(--x); } .mark.o { stroke: var(--o); }
.mark.draw { animation: draw .28s ease-out both; }
.mark.draw + .mark.draw { animation-delay: .14s; }
@keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.cell.dim svg { opacity: .35; }
#winline { position: absolute; inset: 10px; width: calc(100% - 20px); height: calc(100% - 20px); pointer-events: none; overflow: visible; }
#winline line { stroke: var(--win); stroke-width: 9; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: .9; }
#winline line.go { animation: draw .4s ease-out forwards; }

.controls { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.row > .lbl { min-width: 4.5rem; font-size: .95rem; }
.chip, .btn { font-family: var(--body); font-size: 1rem; color: var(--ink); background: var(--paper); border: 2px solid var(--ink); border-radius: 10px 4px 12px 5px; padding: 6px 14px; cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.btn { font-weight: 700; padding: 10px 18px; }
.btn.primary { background: var(--win); border-color: var(--win); color: #1c1407; }
.chip:focus-visible, .btn:focus-visible { outline: 3px dashed var(--win); outline-offset: 2px; }
.btn:active, .chip:active { transform: translateY(1px); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { .mark.draw, #winline line.go { animation-duration: .01s; animation-delay: 0s !important; } .score { transition: none; } }
</style>
</head>
<body>
<main>
  <h1><span class="x">Tic</span> Tac <span class="o">Toe</span></h1>

  <section class="scores" aria-label="Scoreboard">
    <div class="score sx" id="sx"><b id="nx">0</b><small id="lx">You (X)</small></div>
    <div class="score" id="sd"><b id="nd">0</b><small>Draws</small></div>
    <div class="score so" id="so"><b id="no">0</b><small id="lo">Computer (O)</small></div>
  </section>

  <p id="status" role="status" aria-live="polite"></p>

  <div class="boardwrap">
    <div class="board" id="board" role="grid" aria-label="Tic tac toe board"></div>
    <svg id="winline" viewBox="0 0 300 300" aria-hidden="true"><line id="wl" x1="0" y1="0" x2="0" y2="0" pathLength="1"/></svg>
  </div>

  <section class="controls">
    <div class="row"><span class="lbl">Play vs</span>
      <button class="chip" id="m-cpu" aria-pressed="true">Computer</button>
      <button class="chip" id="m-two" aria-pressed="false">A friend</button>
    </div>
    <div class="row" id="diffrow"><span class="lbl">Level</span>
      <button class="chip" id="d-easy" aria-pressed="false">Easy</button>
      <button class="chip" id="d-hard" aria-pressed="true">Unbeatable</button>
    </div>
    <div class="actions">
      <button class="btn primary" id="again">New round</button>
      <button class="btn" id="reset">Reset scores</button>
    </div>
  </section>
</main>

<script>
(function () {
  var LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  var board, turn, over, starter = 'X', mode = 'cpu', level = 'hard', busy = false;
  var score = { X: 0, O: 0, D: 0 };
  var $ = function (id) { return document.getElementById(id); };
  var boardEl = $('board'), cells = [];

  var X_SVG = '<svg viewBox="0 0 100 100" aria-hidden="true"><path class="mark x draw" pathLength="1" d="M20 20 L80 80"/><path class="mark x draw" pathLength="1" d="M80 20 L20 80"/></svg>';
  var O_SVG = '<svg viewBox="0 0 100 100" aria-hidden="true"><path class="mark o draw" pathLength="1" d="M50 15 C72 14 86 30 85 52 C84 74 68 87 48 85 C28 83 14 68 15 48 C16 28 30 16 52 15"/></svg>';

  for (var i = 0; i < 9; i++) {
    var b = document.createElement('button');
    b.className = 'cell'; b.setAttribute('role', 'gridcell');
    b.dataset.i = i;
    b.addEventListener('click', onCell);
    boardEl.appendChild(b); cells.push(b);
  }

  function winnerOf(bd) {
    for (var k = 0; k < LINES.length; k++) {
      var l = LINES[k];
      if (bd[l[0]] && bd[l[0]] === bd[l[1]] && bd[l[0]] === bd[l[2]]) return { p: bd[l[0]], line: l };
    }
    return null;
  }
  function empties(bd) { var r = []; bd.forEach(function (v, i) { if (!v) r.push(i); }); return r; }

  function minimax(bd, player, me) {
    var w = winnerOf(bd);
    if (w) return w.p === me ? 10 : -10;
    var e = empties(bd);
    if (!e.length) return 0;
    var best = player === me ? -99 : 99;
    for (var k = 0; k < e.length; k++) {
      bd[e[k]] = player;
      var s = minimax(bd, player === 'X' ? 'O' : 'X', me);
      bd[e[k]] = null;
      // prefer faster wins and slower losses
      s = s > 0 ? s - 1 : s < 0 ? s + 1 : 0;
      best = player === me ? Math.max(best, s) : Math.min(best, s);
    }
    return best;
  }
  function cpuMove() {
    var e = empties(board);
    if (level === 'easy' && Math.random() < 0.65) return e[Math.floor(Math.random() * e.length)];
    var bestS = -99, moves = [];
    e.forEach(function (m) {
      board[m] = 'O';
      var s = minimax(board, 'X', 'O');
      board[m] = null;
      if (s > bestS) { bestS = s; moves = [m]; } else if (s === bestS) moves.push(m);
    });
    return moves[Math.floor(Math.random() * moves.length)];
  }

  function names() {
    return mode === 'cpu' ? { X: 'You', O: 'Computer' } : { X: 'Player X', O: 'Player O' };
  }
  function render(animateIdx) {
    cells.forEach(function (c, i) {
      var v = board[i];
      c.innerHTML = v ? (v === 'X' ? X_SVG : O_SVG) : '';
      if (v && i !== animateIdx) c.querySelectorAll('.draw').forEach(function (p) { p.classList.remove('draw'); });
      c.disabled = !!v || over || busy;
      c.setAttribute('aria-label', 'Row ' + (Math.floor(i / 3) + 1) + ' column ' + (i % 3 + 1) + ', ' + (v || 'empty'));
    });
    var n = names();
    $('nx').textContent = score.X; $('no').textContent = score.O; $('nd').textContent = score.D;
    $('lx').textContent = n.X + ' (X)'; $('lo').textContent = n.O + ' (O)';
    $('sx').classList.toggle('active', !over && turn === 'X');
    $('so').classList.toggle('active', !over && turn === 'O');
  }
  function setStatus(t) { $('status').textContent = t; }

  function newRound() {
    board = Array(9).fill(null); over = false; busy = false;
    turn = starter;
    var wl = $('wl'); wl.classList.remove('go'); wl.setAttribute('x2', 0); wl.setAttribute('y2', 0);
    wl.setAttribute('x1', 0); wl.setAttribute('y1', 0);
    render();
    announceTurn();
    starter = starter === 'X' ? 'O' : 'X';
    if (mode === 'cpu' && turn === 'O') cpuTurn();
  }
  function announceTurn() {
    var n = names();
    setStatus(mode === 'cpu' ? (turn === 'X' ? 'Your move' : 'Computer is thinking…') : n[turn] + ', your move');
  }
  function place(i) {
    board[i] = turn;
    var w = winnerOf(board);
    if (w) {
      over = true; score[w.p]++;
      var n = names();
      setStatus(mode === 'cpu' ? (w.p === 'X' ? 'You win!' : 'Computer wins') : n[w.p] + ' wins!');
      render(i); drawWin(w.line);
      cells.forEach(function (c, k) { c.classList.toggle('dim', w.line.indexOf(k) < 0); });
      render(i); return;
    }
    if (!empties(board).length) {
      over = true; score.D++; setStatus("It's a draw"); render(i); return;
    }
    turn = turn === 'X' ? 'O' : 'X';
    cells.forEach(function (c) { c.classList.remove('dim'); });
    render(i); announceTurn();
  }
  function drawWin(line) {
    var pt = function (i) { return [(i % 3) * 100 + 50, Math.floor(i / 3) * 100 + 50]; };
    var a = pt(line[0]), b = pt(line[2]);
    var dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy), ext = 22;
    var ux = dx / len, uy = dy / len;
    var wl = $('wl');
    wl.setAttribute('x1', a[0] - ux * ext); wl.setAttribute('y1', a[1] - uy * ext);
    wl.setAttribute('x2', b[0] + ux * ext); wl.setAttribute('y2', b[1] + uy * ext);
    void wl.getBoundingClientRect();
    wl.classList.add('go');
  }
  function cpuTurn() {
    busy = true; render();
    setTimeout(function () {
      if (over) return;
      busy = false; place(cpuMove());
    }, 450);
  }
  function onCell(e) {
    var i = +e.currentTarget.dataset.i;
    if (over || busy || board[i]) return;
    if (mode === 'cpu' && turn !== 'X') return;
    try { navigator.vibrate && navigator.vibrate(12); } catch (e) {}
    place(i);
    if (!over && mode === 'cpu') cpuTurn();
  }

  function setMode(m) {
    mode = m;
    $('m-cpu').setAttribute('aria-pressed', m === 'cpu');
    $('m-two').setAttribute('aria-pressed', m === 'two');
    $('diffrow').style.display = m === 'cpu' ? '' : 'none';
    score = { X: 0, O: 0, D: 0 }; starter = 'X'; newRound();
  }
  function setLevel(l) {
    level = l;
    $('d-easy').setAttribute('aria-pressed', l === 'easy');
    $('d-hard').setAttribute('aria-pressed', l === 'hard');
  }
  $('m-cpu').onclick = function () { setMode('cpu'); };
  $('m-two').onclick = function () { setMode('two'); };
  $('d-easy').onclick = function () { setLevel('easy'); };
  $('d-hard').onclick = function () { setLevel('hard'); };
  $('again').onclick = newRound;
  $('reset').onclick = function () { score = { X: 0, O: 0, D: 0 }; starter = 'X'; newRound(); };

  newRound();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
